version: 2

# Keep both the GitHub Actions we pin and the Python deps we ship current.
# Every dependency change is a bank-review item, so updates arrive as reviewable
# PRs (grouped to cut noise), never auto-merged.
updates:
  # The Actions used by ci.yml / release.yml (checkout, setup-python, pypi-publish, …).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Runtime + dev dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
