name: Publish JSON Schemas

# Serves the bundled JSON Schemas as static files at
# https://prometheuxresearch.github.io/prometheux-cli/ (each schema's `$id` points
# there). The site is built from the SAME schema files the
# CLI ships in src/prometheux_cli/schemas/, so the hosted copies can never drift from
# what `px validate` enforces.

on:
  push:
    branches: [main]
    paths:
      - "src/prometheux_cli/schemas/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          set -euo pipefail
          SRC="src/prometheux_cli/schemas"
          OUT="_site"
          mkdir -p "$OUT"

          # Flat copy: each schema is served at the path its $id references
          # (https://prometheuxresearch.github.io/prometheux-cli/<name>.schema.json).
          cp "$SRC"/*.schema.json "$OUT"/

          # Bypass Jekyll processing (we serve raw static files).
          touch "$OUT/.nojekyll"

          # Generate a simple index listing every published schema.
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Prometheux JSON Schemas</title>'
            echo '<style>body{font:16px/1.5 system-ui,sans-serif;max-width:44rem;margin:3rem auto;padding:0 1rem}code{background:#f4f4f5;padding:.1rem .3rem;border-radius:3px}</style>'
            echo '</head><body>'
            echo '<h1>Prometheux JSON Schemas</h1>'
            echo '<p>Schemas referenced by <code>$schema</code> in files generated by the <code>px</code> CLI.</p>'
            echo '<ul>'
            for f in "$OUT"/*.schema.json; do
              name="$(basename "$f")"
              echo "<li><a href=\"$name\">$name</a></li>"
            done
            echo '</ul></body></html>'
          } > "$OUT/index.html"

          echo "Published files:"
          ls -1 "$OUT"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
