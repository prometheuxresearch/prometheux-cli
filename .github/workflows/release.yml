name: release

# Auto-publish to PyPI on merge to main.
#
# Trigger: every push to main. The `guard` job reads the package version from
# src/prometheux_cli/__init__.py and checks whether a matching `vX.Y.Z` git tag
# already exists. If it does, the run is a no-op (nothing to release). If it does
# NOT, the version was just bumped — so we test, build, publish, and create the
# tag + GitHub Release. To ship a release you therefore only bump __version__ and
# merge; no manual tag push.
#
# Why one workflow (not "merge creates a tag, tag triggers release"): a tag pushed
# by the default GITHUB_TOKEN does NOT trigger another workflow, so the two-file
# design would need a stored PAT. Doing everything in this single push-to-main run
# keeps the "no long-lived secret" posture (design §9/§10).
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token stored. One-time
# setup on PyPI: project → Publishing → add a (pending) publisher with
#   owner: prometheuxresearch   repo: prometheux-cli
#   workflow: release.yml        environment: pypi
# (Alternatively, drop the environment + id-token and add a PYPI_API_TOKEN secret
#  passed as `password:` to the publish step.)

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false      # never abort a publish half-way

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # need all tags to tell "already released" apart
      - id: check
        run: |
          VER="$(grep -E '^__version__' src/prometheux_cli/__init__.py \
                 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if git tag -l "v$VER" | grep -q .; then
            echo "v$VER already tagged — nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VER is new — will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: guard
    if: needs.guard.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  release:
    needs: [guard, test]
    if: needs.guard.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # Trusted Publishing (PyPI) + Sigstore attestation
      attestations: write      # actions/attest-build-provenance
      contents: write          # create the tag + GitHub Release, attach artifacts
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - name: Sanity-check the built version matches __version__
        run: |
          python -m pip install -e .
          PKG_VER="$(python -c 'import prometheux_cli; print(prometheux_cli.__version__)')"
          test "$PKG_VER" = "$VERSION" || { echo "built $PKG_VER != guard $VERSION"; exit 1; }
      - name: Generate SBOM + checksums (into ./artifacts, keeping dist/ pure)
        run: |
          mkdir -p artifacts
          python -m pip install cyclonedx-bom
          # SBOM from the hashed lockfile — the exact transitive tree we ship.
          cyclonedx-py requirements requirements.lock \
            --output-format JSON --output-file artifacts/sbom.cyclonedx.json
          sha256sum dist/prometheux-*.whl dist/prometheux-*.tar.gz \
            artifacts/sbom.cyclonedx.json > artifacts/SHA256SUMS
      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/prometheux-*.whl,dist/prometheux-*.tar.gz"
      - name: Publish to PyPI
        # dist/ holds only the wheel + sdist; gh-action-pypi-publish emits PEP 740
        # attestations by default.
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Extract this version's CHANGELOG section for the release notes
        # Pull the "## [VERSION]" block out of CHANGELOG.md. If it's missing/empty
        # the file is still created (empty), and generate_release_notes below fills
        # in a commit-based summary as a fallback.
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag && /^\[.*\]: http/ {next}   # drop reference-link definitions
            flag {print}
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          echo "----- release notes preview -----"; cat release-notes.md
      - name: Create tag vX.Y.Z + GitHub Release, attach SBOM + checksums
        # softprops creates the tag at this commit if it does not exist yet, so
        # no separate `git tag && git push` step (and no PAT) is needed.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: release-notes.md
          generate_release_notes: true   # appends a commit/PR summary under the CHANGELOG body
          files: |
            artifacts/sbom.cyclonedx.json
            artifacts/SHA256SUMS
