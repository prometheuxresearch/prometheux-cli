name: release

# Build and publish to PyPI when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token stored. One-time
# setup on PyPI: project → Publishing → add a trusted publisher with
#   owner: prometheuxresearch   repo: prometheux-cli
#   workflow: release.yml        environment: pypi
# (Alternatively, drop the environment + id-token and add a PYPI_API_TOKEN secret
#  passed as `password:` to the publish step.)

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # Trusted Publishing (PyPI) + Sigstore attestation
      attestations: write      # actions/attest-build-provenance
      contents: write          # attach SBOM + checksums to the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check the tag matches the package version
        run: |
          python -m pip install -e .
          PKG_VER="$(python -c 'import prometheux_cli; print(prometheux_cli.__version__)')"
          TAG_VER="${GITHUB_REF_NAME#v}"
          test "$PKG_VER" = "$TAG_VER" || { echo "tag $TAG_VER != package $PKG_VER"; exit 1; }
      - name: Generate SBOM + checksums (into ./artifacts, keeping dist/ pure)
        run: |
          mkdir -p artifacts
          python -m pip install cyclonedx-bom
          # SBOM from the hashed lockfile — the exact transitive tree we ship.
          cyclonedx-py requirements requirements.lock \
            --output-format JSON --output-file artifacts/sbom.cyclonedx.json
          sha256sum dist/prometheux-*.whl dist/prometheux-*.tar.gz \
            artifacts/sbom.cyclonedx.json > artifacts/SHA256SUMS
      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/prometheux-*.whl,dist/prometheux-*.tar.gz"
      - name: Publish to PyPI
        # dist/ holds only the wheel + sdist; gh-action-pypi-publish emits PEP 740
        # attestations by default.
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach SBOM + checksums to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sbom.cyclonedx.json
            artifacts/SHA256SUMS
