name: release

# Build and publish to PyPI when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token stored. One-time
# setup on PyPI: project → Publishing → add a trusted publisher with
#   owner: prometheuxresearch   repo: prometheux-cli
#   workflow: release.yml        environment: pypi
# (Alternatively, drop the environment + id-token and add a PYPI_API_TOKEN secret
#  passed as `password:` to the publish step.)

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check the tag matches the package version
        run: |
          PKG_VER="$(python -c 'import prometheux_cli; print(prometheux_cli.__version__)')"
          TAG_VER="${GITHUB_REF_NAME#v}"
          test "$PKG_VER" = "$TAG_VER" || { echo "tag $TAG_VER != package $PKG_VER"; exit 1; }
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
